<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"P";font-weight:300;src:url("fonts/node_modules/@fontsource/poppins/files/poppins-latin-300-normal.woff2")}
@font-face{font-family:"P";font-weight:500;src:url("fonts/node_modules/@fontsource/poppins/files/poppins-latin-500-normal.woff2")}
@font-face{font-family:"P";font-weight:600;src:url("fonts/node_modules/@fontsource/poppins/files/poppins-latin-600-normal.woff2")}
@font-face{font-family:"P";font-weight:700;src:url("fonts/sistema/Poppins-Bold.ttf")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:"P",sans-serif;background:#162526;color:#fff}
.f{position:absolute;top:0;height:800px;background-size:cover}
.fa{left:0;width:600px;background-image:url(assets/flavio.jpg);background-position:50% 12%;clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}
.fb{right:0;width:600px;background-image:url(assets/lula.jpg);background-position:50% 8%;clip-path:polygon(12% 0,100% 0,100% 100%,0 100%)}
.sh{position:absolute;left:0;right:0;top:0;height:800px;background:linear-gradient(180deg,rgba(22,37,38,0) 55%,rgba(22,37,38,.95) 100%)}
.ln{position:absolute;left:0;top:0;width:1080px;height:800px;background:linear-gradient(#FFB400,#FFB400) 0 0/0 0 no-repeat}
.vs{position:absolute;left:540px;top:610px;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:#FFB400;border:9px solid #162526;box-shadow:0 0 0 3px #FFB400;display:flex;align-items:center;justify-content:center;font-weight:700;font-style:italic;font-size:62px;color:#162526}
.nm{position:absolute;top:668px;font-weight:600;font-size:34px;letter-spacing:.5px;text-transform:uppercase}
.nm small{display:inline-block;margin-left:12px;font-size:19px;font-weight:500;border:1.5px solid rgba(255,255,255,.7);border-radius:6px;padding:2px 9px;vertical-align:4px}
.na{left:44px}.nb{right:44px;text-align:right}
.pill{position:absolute;left:50%;top:845px;transform:translateX(-50%);background:#FFB400;color:#162526;font-weight:600;font-size:27px;letter-spacing:.5px;padding:10px 30px;border-radius:12px;white-space:nowrap;text-transform:uppercase}
h1{position:absolute;left:0;right:0;top:935px;text-align:center;font-weight:700;font-size:74px;line-height:1.05;letter-spacing:-1.5px}
h1 span{color:#FFB400}
.sub{position:absolute;left:0;right:0;top:1198px;text-align:center;font-weight:600;font-size:42px;line-height:1.3;color:#e8f0ea}
.sub b{font-weight:600}
.q{position:absolute;left:0;right:0;top:1228px;text-align:center;font-weight:600;font-size:40px;color:#FFB400}.ar{position:absolute;left:0;right:0;top:1275px;text-align:center;font-weight:300;font-size:27px;color:rgba(255,255,255,.65)}
</style></head><body>
<div class="f fa"></div><div class="f fb"></div><div class="sh"></div>
<div class="nm na">Flávio Bolsonaro<small>PL</small></div><div class="nm nb">Lula<small>PT</small></div>
<div class="vs">VS</div>
<div class="pill">2º turno para presidente</div>
<h1>Faltam poucas horas<br>para saber quem será<br>o <span>presidente</span> em 2026</h1>
<div class="sub">Confira os números de cada um</div><div class="q" style="font-size:30px;font-weight:300;color:rgba(255,255,255,.7);top:1268px">Arrasta pro lado 👉</div>

</body></html>
