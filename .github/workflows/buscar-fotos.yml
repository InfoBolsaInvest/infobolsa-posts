name: Buscar fotos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["kit/fotos/buscar.json"]
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 kit/fotos/buscar_fotos.py
      - run: |
          git config user.name "infobolsa-bot"
          git config user.email "infobolsa-bot@users.noreply.github.com"
          git add kit/fotos
          git commit -m "Fotos candidatas do Wikimedia Commons" || exit 0
          git pull --rebase
          git push
